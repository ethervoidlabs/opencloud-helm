{{/*
Expand the name of the chart.
*/}}
{{- define "opencloud.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Create a default fully qualified app name.
We truncate at 63 chars because some Kubernetes name fields are limited to this (by the DNS naming spec).
If release name contains chart name it will be used as a full name.
*/}}
{{- define "opencloud.fullname" -}}
{{- if .Values.fullnameOverride }}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := default .Chart.Name .Values.nameOverride }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}

{{/*
Create chart name and version as used by the chart label.
*/}}
{{- define "opencloud.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Common labels
*/}}
{{- define "opencloud.labels" -}}
helm.sh/chart: {{ include "opencloud.chart" . }}
{{ include "opencloud.selectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{/*
Selector labels
*/}}
{{- define "opencloud.selectorLabels" -}}
app.kubernetes.io/name: {{ include "opencloud.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{/*
Create the name of the service account to use
*/}}
{{- define "opencloud.serviceAccountName" -}}
{{- if .Values.serviceAccount.create }}
{{- default (include "opencloud.fullname" .) .Values.serviceAccount.name }}
{{- else }}
{{- default "default" .Values.serviceAccount.name }}
{{- end }}
{{- end }}

{{/*
Create a fully qualified OpenCloud name.
*/}}
{{- define "opencloud.opencloud.fullname" -}}
{{- printf "%s-opencloud" (include "opencloud.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Create a fully qualified Keycloak name.
*/}}
{{- define "opencloud.keycloak.fullname" -}}
{{- printf "%s-keycloak" (include "opencloud.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Create a fully qualified PostgreSQL name.
*/}}
{{- define "opencloud.postgres.fullname" -}}
{{- printf "%s-postgres" (include "opencloud.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Create a fully qualified MinIO name.
*/}}
{{- define "opencloud.minio.fullname" -}}
{{- printf "%s-minio" (include "opencloud.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Return the OpenCloud domain
*/}}
{{- define "opencloud.domain" -}}
{{- .Values.global.domain.opencloud }}
{{- end }}

{{/*
Return the Keycloak domain
*/}}
{{- define "opencloud.keycloak.domain" -}}
{{- .Values.global.domain.keycloak }}
{{- end }}

{{/*
Return the MinIO domain
*/}}
{{- define "opencloud.minio.domain" -}}
{{- .Values.global.domain.minio }}
{{- end }}


{{/*
Return the OnlyOffice domain
*/}}
{{- define "opencloud.onlyoffice.domain" -}}
{{- .Values.global.domain.onlyoffice }}
{{- end }}

{{/*
Return the Collabora domain
*/}}
{{- define "opencloud.collabora.domain" -}}
{{- .Values.global.domain.collabora }}
{{- end }}

{{/*
Return the Companion domain
*/}}
{{- define "opencloud.companion.domain" -}}
{{- .Values.global.domain.companion }}
{{- end }}

{{/*
Return the WOPI domain
*/}}
{{- define "opencloud.wopi.domain" -}}
{{- .Values.global.domain.wopi }}
{{- end }}

{{/*
Create a fully qualified Tika name.
*/}}
{{- define "opencloud.tika.fullname" -}}
{{- printf "%s-tika" (include "opencloud.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/* namespace helper removed - use .Release.Namespace directly */}}

{{/*
Return the image registry, using global override if set
*/}}
{{- define "opencloud.image.registry" -}}
{{- coalesce .global.image.registry .registry -}}
{{- end -}}

{{/*
Return the image pull policy, using global override if set
*/}}
{{- define "opencloud.image.pullPolicy" -}}
{{- coalesce .global.image.pullPolicy .pullPolicy -}}
{{- end -}}

{{/*
Return the full image name with registry
*/}}
{{- define "opencloud.image" -}}
{{- $registry := include "opencloud.image.registry" (dict "registry" .imageValues.registry "global" .global) -}}
{{- if $registry -}}
{{- printf "%s/%s:%s" $registry .imageValues.repository .imageValues.tag -}}
{{- else -}}
{{- printf "%s:%s" .imageValues.repository .imageValues.tag -}}
{{- end -}}
{{- end -}}

{{/* Require immutable image references for every enabled workload. */}}
{{- define "opencloud.validateImageDigest" -}}
{{- if not (contains "@sha256:" .tag) -}}
{{- fail (printf "%s.image.tag must include a verified @sha256: digest (got %q)" .component .tag) -}}
{{- end -}}
{{- end -}}

{{/* Fail closed on credentials and mutable images. */}}
{{- define "opencloud.validate" -}}
{{- include "opencloud.validateImageDigest" (dict "component" "image" "tag" .Values.image.tag) }}
{{- include "opencloud.validateImageDigest" (dict "component" "busybox.image" "tag" .Values.busybox.image.tag) }}
{{- if not (has .Values.opencloud.storage.mode (list "s3" "posixfs")) }}
{{- fail (printf "opencloud.storage.mode must be either s3 or posixfs (got %q)" .Values.opencloud.storage.mode) }}
{{- end }}
{{- if and .Values.keycloak.internal.enabled (not .Values.keycloak.internal.existingSecret) }}
{{- if not .Values.keycloak.internal.adminPassword }}{{ fail "keycloak.internal.adminPassword must be set when existingSecret is empty" }}{{ end }}
{{- end }}
{{- if and .Values.postgres.enabled .Values.keycloak.internal.enabled (not .Values.postgres.existingSecret) }}
{{- if not .Values.postgres.password }}{{ fail "postgres.password must be set when existingSecret is empty" }}{{ end }}
{{- end }}
{{- if and .Values.opencloud.enabled (not .Values.opencloud.existingSecret) }}
{{- if not .Values.opencloud.adminPassword }}{{ fail "opencloud.adminPassword must be set when existingSecret is empty" }}{{ end }}
{{- end }}
{{- if and .Values.keycloak.internal.enabled (not (contains "@sha256:" .Values.keycloak.internal.image.tag)) }}
{{- fail "keycloak.internal.image.tag must include a verified @sha256: digest" }}
{{- end }}
{{- if and .Values.postgres.enabled .Values.keycloak.internal.enabled (not (contains "@sha256:" .Values.postgres.image.tag)) }}
{{- fail "postgres.image.tag must include a verified @sha256: digest" }}
{{- end }}
{{- if and .Values.tika.enabled (not (contains "@sha256:" .Values.tika.image.tag)) }}
{{- fail "tika.image.tag must include a verified @sha256: digest" }}
{{- end }}
{{- if .Values.collabora.enabled }}
{{- if not (contains "@sha256:" .Values.collabora.image.tag) }}{{ fail "collabora.image.tag must include a verified @sha256: digest" }}{{ end }}
{{- if and (not .Values.collabora.existingSecret) (not .Values.collabora.admin.password) }}{{ fail "collabora.admin.password must be set when existingSecret is empty" }}{{ end }}
{{- end }}
{{- if .Values.onlyoffice.enabled }}
{{- if not (contains "@sha256:" .Values.onlyoffice.image.tag) }}{{ fail "onlyoffice.image.tag must include a verified @sha256: digest" }}{{ end }}
{{- if and (not .Values.onlyoffice.config.coAuthoring.secret.existingSecret) (not .Values.onlyoffice.config.coAuthoring.secret.session.string) }}{{ fail "onlyoffice session secret must be set when existingSecret is empty" }}{{ end }}
{{- if and (not .Values.onlyoffice.config.rabbitmq.existingSecret) (not .Values.onlyoffice.config.rabbitmq.url) }}{{ fail "onlyoffice rabbitmq URL must be set when existingSecret is empty" }}{{ end }}
{{- end }}
{{- if .Values.webExtensions.enabled }}
{{- range $name, $extension := .Values.webExtensions.extensions }}
{{- if and $extension.enabled (not (contains "@sha256:" $extension.tag)) }}{{ fail (printf "webExtensions.extensions.%s.tag must include a verified @sha256: digest" $name) }}{{ end }}
{{- end }}
{{- end }}
{{- if and (eq .Values.opencloud.storage.mode "s3") .Values.opencloud.storage.s3.internal.enabled }}
{{- if and (not .Values.opencloud.storage.s3.internal.existingSecret) (not .Values.opencloud.storage.s3.internal.rootPassword) }}{{ fail "opencloud.storage.s3.internal.rootPassword must be set when existingSecret is empty" }}{{ end }}
{{- if not (contains "@sha256:" .Values.opencloud.storage.s3.internal.image.tag) }}{{ fail "opencloud.storage.s3.internal.image.tag must include a verified @sha256: digest" }}{{ end }}
{{- end }}
{{- if eq .Values.opencloud.storage.mode "s3" }}
{{- if and .Values.opencloud.storage.s3.internal.enabled .Values.opencloud.storage.s3.external.enabled }}{{ fail "enable only one S3 backend: internal or external" }}{{ end }}
{{- if not (or .Values.opencloud.storage.s3.internal.enabled .Values.opencloud.storage.s3.external.enabled) }}{{ fail "S3 storage requires either the internal or external backend" }}{{ end }}
{{- if .Values.opencloud.storage.s3.external.enabled }}
{{- if not .Values.opencloud.storage.s3.external.endpoint }}{{ fail "opencloud.storage.s3.external.endpoint must be set when external S3 is enabled" }}{{ end }}
{{- if not .Values.opencloud.storage.s3.external.bucket }}{{ fail "opencloud.storage.s3.external.bucket must be set when external S3 is enabled" }}{{ end }}
{{- if and (not .Values.opencloud.storage.s3.external.existingSecret) (or (not .Values.opencloud.storage.s3.external.accessKey) (not .Values.opencloud.storage.s3.external.secretKey)) }}{{ fail "external S3 requires existingSecret or both accessKey and secretKey" }}{{ end }}
{{- end }}
{{- end }}
{{- end -}}

{{/*
Return the appropriate apiVersion for ingress
*/}}
{{- define "opencloud.ingress.apiVersion" -}}
{{- if .Capabilities.APIVersions.Has "networking.k8s.io/v1/Ingress" -}}
{{- print "networking.k8s.io/v1" -}}
{{- else -}}
{{- print "networking.k8s.io/v1beta1" -}}
{{- end -}}
{{- end -}}
